#cloud-config
hostname: proxmox-vm-template
users:
  - default
  - name: ops
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...replace-me
package_update: true
packages:
  - qemu-guest-agent
  - curl
runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
