services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Prefer a Docker socket proxy in production instead of direct socket mount.
      - /var/run/docker.sock:/var/run/docker.sock:ro
